# Home Assistant add-on manifest. This file is published to the public
# ogglord/ha-addons (ha_agent/), so it holds no personal values: the hub
# URL and any host-specific policy are set in the add-on's Configuration in HA.
name: Hemma Agent
description: Headless Claude Code and the homelab peer listener
version: "0.3.11"
slug: ha_agent
url: https://github.com/ogglord/ha-addons
arch: [amd64]
image: ghcr.io/ogglord/hemma-agent-{arch}
init: false
startup: services
boot: auto
# The Web UI in HA: a read-only status page (status.py), through ingress only.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
# Seconds the Supervisor waits on stop: peer posts an interrupted run's result.
timeout: 60
# Requests change HA itself: add-on options (a Mosquitto login), core
# config, restarts. `manager` lets the `ha` CLI change other add-ons.
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
# Claude's caches and peer's run worktrees are rebuilt on demand; the login
# (home/.claude/.credentials.json, home/.claude.json) is kept.
backup_exclude:
  - "home/.cache/**"
  - "home/.claude/cache/**"
  - "home/.claude/projects/**"
  - "home/.claude/shell-snapshots/**"
  - "home/.local/share/claude/**"
  - "peer/runs/**"
options:
  # The peer hub on the tailnet, e.g. http://100.x.y.z:7790. Required.
  hub_url: null
  # Tool rules (Claude Code permission syntax). Empty: peer's built-in lists.
  # Note the built-in deny list includes curl and wget.
  allow: []
  deny: []
  # Auto mode's policy, prose rules. "$defaults" keeps Claude Code's built-ins.
  policy_environment:
    - "$defaults"
    - "This is the Home Assistant OS box, inside the Hemma Agent add-on. The ha CLI and SUPERVISOR_TOKEN manage Home Assistant, its add-ons and its host."
  policy_allow:
    - "$defaults"
  policy_hard_deny:
    - "$defaults"
    - "Minting peer enrolment codes or enrolling approver keys"
  # Model for runs and Remote Control sessions. Empty: Claude's default.
  model: ""
  # A git checkout runs work in (one worktree per request), e.g.
  # /homeassistant if HA's config is a git repo. Empty: /data/agent.
  checkout: ""
  # Claude Code Remote Control: a session on this box from claude.ai/code or
  # the Claude app. Needs the claude.ai login (DOCS.md).
  remote_control: true
  remote_control_name: Home Assistant Agent
  # ESJavadex/claude-homeassistant-plugins: HA YAML skills and a hook that
  # checks YAML after every edit, for runs and Remote Control sessions.
  ha_plugin: true
  # `claude setup-token` (one year) for peer runs. Empty: runs use the
  # claude.ai login, which Remote Control needs anyway.
  claude_token: ""
  # The HA script that reaches the owner's phone (Hemma, with text replies:
  # hub 0.1.32+). The login link and token warnings go there. Empty: log only.
  notify_script: hemma_notify_admin
  # How much the add-on's log says: debug adds the routine lines (the hub
  # stream reconnecting, runs starting, the plugin).
  log_level: info
schema:
  hub_url: url
  allow: [str]
  deny: [str]
  policy_environment: [str]
  policy_allow: [str]
  policy_hard_deny: [str]
  model: str?
  checkout: str?
  remote_control: bool
  remote_control_name: str
  ha_plugin: bool
  claude_token: password?
  notify_script: str?
  log_level: list(debug|info|warning|error)?
